version = 1

[runtime]
host = "127.0.0.1"
web_port = 3080
proof_api_port = 43100
data_dir = ".math-agent"
open_browser = false

[proof]
default_mode = "prove"
max_workers = 2
max_steps = 8
history_limit = 8

[formalization]
enabled = false

[literature]
enabled = false

[models.gemini37]
provider = "google-vertex"
model = "gemini-3.7-flash"
service_account_file_env = "GOOGLE_APPLICATION_CREDENTIALS"
reasoning_effort = "high"
context_window = 1048576
max_tokens = 8192

[roles.planner]
model = "gemini37"

[roles.worker]
model = "gemini37"

[roles.verifier]
model = "gemini37"

[roles.synthesizer]
model = "gemini37"
enabled = false

[roles.formalizer]
model = "gemini37"
enabled = false

[roles.literature_researcher]
model = "gemini37"
enabled = false
