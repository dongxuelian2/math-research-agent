version = 1

[runtime]
host = "127.0.0.1"
web_port = 3080
proof_api_port = 43100
data_dir = ".math-agent"

[proof]
default_mode = "prove_and_formalize"
workflow_mode = "dynamic"
max_workers = 8
max_steps = 64
history_limit = 64

[formalization]
enabled = true
project_dir = "formalization"
command = "lake"

[literature]
enabled = true

[research]
max_cycles = 1000
checkpoint_interval = 10
stall_threshold = 30
structural_probe_budget = 20
max_active_obligations = 80

[budgets]
planner_calls = 10000
worker_calls = 10000
verifier_calls = 10000
secondary_auditor_calls = 1000
literature_searches = 1000
tool_calls = 50000
wall_time_seconds = 3600

[corpus]
enabled = true
roots = []
import_authority_policy = "PROVISIONAL_IMPORTED"

[tools]
enabled = true
allowed_capabilities = ["artifact_search", "artifact_read", "artifact_metadata", "corpus_read", "corpus_search", "scratch_read", "scratch_write", "controlled_computation"]
allowed_executables = ["node", "python", "lean", "lake"]
execution_boundary = "CONTROLLED_COMMAND_RUNNER"

[models.gemini37]
provider = "google-vertex"
model = "gemini-3.7-flash"
service_account_file_env = "GOOGLE_APPLICATION_CREDENTIALS"
reasoning_effort = "high"
context_window = 1048576
max_tokens = 65536

[roles.planner]
model = "gemini37"

[roles.research_director]
model = "gemini37"

[roles.corpus_bootstrapper]
model = "gemini37"

[roles.worker]
model = "gemini37"

[roles.verifier]
model = "gemini37"

[roles.secondary_auditor]
model = "gemini37"

[roles.synthesizer]
model = "gemini37"
enabled = true

[roles.formalizer]
model = "gemini37"
enabled = true
max_turns = 64
timeout_seconds = 600

[roles.literature_researcher]
model = "gemini37"
enabled = true
