# Cloud Run demo profile.
#
# The repository still contains the complete Lean/Lake formalization source and
# the pinned upstream Lean skill. This profile deliberately does not enable the
# process-backed formalization gate because the Cloud Run image is kept free of
# the Lean toolchain and Mathlib package.
version = 1

[runtime]
host = "127.0.0.1"
web_port = 3080
proof_api_port = 43100
data_dir = ".math-agent"

[proof]
default_mode = "prove"
workflow_mode = "dynamic"
max_workers = 2
max_steps = 8
history_limit = 8

[formalization]
enabled = false
packages = []
default_imports = []
setup_on_session_create = false

[literature]
enabled = true

[research]
max_cycles = 100
checkpoint_interval = 1
stall_threshold = 3
structural_probe_budget = 2
max_active_obligations = 8

[budgets]
planner_calls = 1000
worker_calls = 1000
verifier_calls = 1000
secondary_auditor_calls = 100
literature_searches = 100
tool_calls = 5000
wall_time_seconds = 86400

[corpus]
enabled = true
roots = []
import_authority_policy = "PROVISIONAL_IMPORTED"
publishing_enabled = false
repository_url = "https://github.com/dongxuelian2/three-term-decimal-concatenation-square-sum.git"
local_checkout = ""
branch = "main"
auto_push = false
index_command = ["python", "tools/update-research-index.py"]

[tools]
enabled = true
allowed_capabilities = ["artifact_search", "artifact_read", "artifact_metadata", "corpus_read", "corpus_search", "scratch_read", "scratch_write", "controlled_computation"]
allowed_executables = ["node"]
execution_boundary = "CONTROLLED_COMMAND_RUNNER"

[models.gemini37]
provider = "google-vertex"
model = "gemini-3.7-flash"
reasoning_effort = "high"
context_window = 1048576
max_tokens = 8192

[roles.planner]
model = "gemini37"

[roles.research_director]
model = "gemini37"

[roles.corpus_bootstrapper]
model = "gemini37"

[roles.worker]
model = "gemini37"

[roles.verifier]
model = "gemini37"

[roles.secondary_auditor]
model = "gemini37"

[roles.synthesizer]
model = "gemini37"
enabled = true

[roles.formalizer]
model = "gemini37"
enabled = false

[roles.literature_researcher]
model = "gemini37"
enabled = true
