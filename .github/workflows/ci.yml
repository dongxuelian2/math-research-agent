name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff, tests, and showcase
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked development environment
        run: uv sync --extra dev --locked

      - name: Check Ruff formatting
        run: uv run ruff format --check src tests

      - name: Check Ruff lint
        run: uv run ruff check src tests

      - name: Run unit tests
        run: uv run pytest -q

      - name: Compile Python sources
        run: uv run python -m compileall -q src

      - name: Run deterministic repair showcase
        env:
          OBSERVATORY_PROJECT: ${{ runner.temp }}/observatory-demo
        run: uv run python -m math_research_agent.research demo --project "$OBSERVATORY_PROJECT"

  windows-bootstrap:
    name: Windows bootstrap and launcher
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Bootstrap Windows environment
        shell: pwsh
        run: .\scripts\bootstrap.ps1

      - name: Exercise PowerShell launcher
        shell: pwsh
        run: .\scripts\run_math_agent.ps1 -Command status -Project demo -Target demo-odd-sum
