name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff, tests, and showcase
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: openprover/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked development environment
        run: uv sync --project openprover --extra dev --locked

      - name: Check Ruff formatting
        run: uv run --project openprover ruff format --check openprover

      - name: Check Ruff lint
        run: uv run --project openprover ruff check openprover

      - name: Run unit tests
        run: uv run --project openprover pytest -q

      - name: Compile Python sources
        run: uv run --project openprover python -m compileall -q openprover

      - name: Run deterministic repair showcase
        env:
          OBSERVATORY_PROJECT: ${{ runner.temp }}/observatory-demo
        run: uv run --project openprover python -m openprover.math_research demo --project "$OBSERVATORY_PROJECT"
