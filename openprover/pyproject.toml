[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openprover"
version = "1.0.1"
description = "Automated theorem proving using agentic system with frontier LLMs."
readme = "README.md"
authors = [{name = "Matěj Kripner", email = "kripner@ufal.mff.cuni.cz"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
openprover = "openprover.cli:main"
math-research = "openprover.math_research.cli:main"

[tool.setuptools.packages.find]
include = ["openprover*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
